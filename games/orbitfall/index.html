<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBITFALL — hold the orbit, outlive the collapse</title>
<style>
/* ORBITFALL page shell: a black void, the canvas centred and letterboxed. */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  background: #01020a;
  overflow: hidden;
}

#wrap {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#stage {
  display: block;
  background: #050914;
  box-shadow: 0 0 90px rgba(38, 90, 180, 0.35), 0 0 22px rgba(55, 244, 255, 0.12);
  cursor: crosshair;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

</style>
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAlElEQVR4nO3VuQ3AIAwFUBqK9NklVRbMCGyWPdIT0Ua244NLwsUv4T9ZwoS47XlkggOWABxPHgMoxd+sA4DKIYQJkNPZdwKl8C/NAJxyCBFrvAJJOYZQA8ii+zIjSABaikWBkAGocgThADVAVa5AzDsBB0yxB1BEr03IQrT+CzQI7p0iABchuU8MgECW82ZAjTjAAS9dippziDL2aQAAAABJRU5ErkJggg==">
</head>
<body>
<main id="wrap">
  <canvas id="stage" width="1280" height="800"></canvas>
</main>
<script>
(() => {
  // orbitfall/game/js/rng.js
  var TAU = Math.PI * 2;
  function mulberry32(seed2) {
    let a = seed2 >>> 0;
    return function next() {
      a |= 0;
      a = a + 1831565813 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed2) {
    const next = mulberry32(seed2);
    return {
      next,
      range: (min, max) => min + next() * (max - min),
      int: (min, max) => Math.floor(min + next() * (max - min + 1)),
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      chance: (p) => next() < p,
      angle: () => next() * TAU,
      sign: () => next() < 0.5 ? -1 : 1
    };
  }
  var clamp = (v, min, max) => v < min ? min : v > max ? max : v;

  // orbitfall/game/js/world.js
  var VIEW_W = 1280;
  var VIEW_H = 800;
  var STAR = {
    x: VIEW_W / 2,
    y: VIEW_H / 2,
    surface: 76,
    // anything crossing this radius is eaten / burned
    core: 54
  };
  var GM = 235e5;
  var SOFT2 = 150 * 150;
  function gravityAt(x, y) {
    const dx = STAR.x - x;
    const dy = STAR.y - y;
    const r2 = dx * dx + dy * dy + SOFT2;
    const r = Math.sqrt(r2 - SOFT2) || 1;
    const a = GM / r2;
    return { ax: dx / (r || 1) * a, ay: dy / (r || 1) * a, r };
  }
  function applyGravity(e, dt, scale = 1) {
    const g = gravityAt(e.x, e.y);
    e.vx += g.ax * scale * dt;
    e.vy += g.ay * scale * dt;
    return g.r;
  }
  function orbitalDamp(e, dt, radialRate = 0.9, tangentialRate = 0.06) {
    const dx = e.x - STAR.x;
    const dy = e.y - STAR.y;
    const r = Math.sqrt(dx * dx + dy * dy) || 1;
    const ux = dx / r;
    const uy = dy / r;
    const vr = e.vx * ux + e.vy * uy;
    const vt = e.vx * -uy + e.vy * ux;
    const vr2 = vr * Math.max(0, 1 - radialRate * dt);
    const vt2 = vt * Math.max(0, 1 - tangentialRate * dt);
    e.vx = ux * vr2 + -uy * vt2;
    e.vy = uy * vr2 + ux * vt2;
  }
  function distToStar(x, y) {
    const dx = x - STAR.x;
    const dy = y - STAR.y;
    return Math.sqrt(dx * dx + dy * dy);
  }
  var Starfield = class {
    constructor() {
      const rng = makeRng(20261115);
      this.layers = [];
      const defs = [
        { count: 110, depth: 4, size: 1, alpha: 0.5 },
        { count: 70, depth: 9, size: 1.6, alpha: 0.75 },
        { count: 34, depth: 16, size: 2.4, alpha: 1 }
      ];
      for (const d of defs) {
        const stars = [];
        for (let i = 0; i < d.count; i++) {
          stars.push({
            x: rng.next() * VIEW_W,
            y: rng.next() * VIEW_H,
            tw: rng.range(1, 4),
            // twinkle speed
            ph: rng.range(0, TAU)
          });
        }
        this.layers.push({ ...d, stars });
      }
      this.nebula = this.buildNebula(rng);
    }
    buildNebula(rng) {
      const c = document.createElement("canvas");
      c.width = VIEW_W;
      c.height = VIEW_H;
      const g = c.getContext("2d");
      const blobs = [
        ["rgba(38, 20, 92, 0.55)", 240, 150, 420],
        ["rgba(10, 60, 92, 0.5)", 1060, 620, 460],
        ["rgba(92, 16, 74, 0.42)", 1090, 130, 340],
        ["rgba(14, 44, 84, 0.5)", 180, 660, 380],
        ["rgba(70, 30, 10, 0.35)", 640, 400, 520]
      ];
      for (const [color, x, y, r] of blobs) {
        const grad = g.createRadialGradient(x, y, 0, x, y, r);
        grad.addColorStop(0, color);
        grad.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = grad;
        g.fillRect(x - r, y - r, r * 2, r * 2);
      }
      g.fillStyle = "rgba(180,200,255,0.5)";
      for (let i = 0; i < 160; i++) {
        g.globalAlpha = 0.12 + rng.next() * 0.3;
        g.fillRect(rng.next() * VIEW_W, rng.next() * VIEW_H, 1, 1);
      }
      g.globalAlpha = 1;
      return c;
    }
    draw(ctx2, t, focusX, focusY) {
      ctx2.fillStyle = "#050914";
      ctx2.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx2.drawImage(this.nebula, 0, 0);
      const ox = (focusX - STAR.x) / STAR.x;
      const oy = (focusY - STAR.y) / STAR.y;
      for (const layer of this.layers) {
        ctx2.fillStyle = "#cfe8ff";
        for (const s of layer.stars) {
          const tw = 0.65 + 0.35 * Math.sin(t * s.tw + s.ph);
          ctx2.globalAlpha = layer.alpha * tw;
          const x = s.x - ox * layer.depth;
          const y = s.y - oy * layer.depth;
          ctx2.fillRect(x, y, layer.size, layer.size);
        }
      }
      ctx2.globalAlpha = 1;
    }
  };
  function drawStar(ctx2, t) {
    const { x, y, surface, core } = STAR;
    let glow = ctx2.createRadialGradient(x, y, core, x, y, surface * 3.4);
    glow.addColorStop(0, "rgba(255, 166, 66, 0.30)");
    glow.addColorStop(0.5, "rgba(255, 94, 58, 0.10)");
    glow.addColorStop(1, "rgba(255, 94, 58, 0)");
    ctx2.fillStyle = glow;
    ctx2.fillRect(x - surface * 3.4, y - surface * 3.4, surface * 6.8, surface * 6.8);
    ctx2.save();
    ctx2.translate(x, y);
    for (let i = 0; i < 26; i++) {
      const a = i / 26 * TAU + t * 0.05;
      const flicker = 0.72 + 0.28 * Math.sin(t * 2.3 + i * 1.7) * Math.sin(t * 0.9 + i);
      const len = surface * (0.55 + 0.5 * flicker);
      const w = 0.055 + 0.03 * Math.sin(t * 1.4 + i * 2.3);
      ctx2.rotate(0);
      ctx2.beginPath();
      ctx2.moveTo(Math.cos(a - w) * surface * 0.92, Math.sin(a - w) * surface * 0.92);
      ctx2.lineTo(Math.cos(a) * (surface + len), Math.sin(a) * (surface + len));
      ctx2.lineTo(Math.cos(a + w) * surface * 0.92, Math.sin(a + w) * surface * 0.92);
      ctx2.closePath();
      ctx2.fillStyle = "rgba(255, 140, 60, 0.20)";
      ctx2.fill();
    }
    ctx2.restore();
    const body = ctx2.createRadialGradient(x, y, 0, x, y, surface);
    body.addColorStop(0, "#fff7dd");
    body.addColorStop(0.45, "#ffd98a");
    body.addColorStop(0.78, "#ff9a3d");
    body.addColorStop(0.95, "#ff5f3c");
    body.addColorStop(1, "#e83a2a");
    ctx2.fillStyle = body;
    ctx2.beginPath();
    ctx2.arc(x, y, surface, 0, TAU);
    ctx2.fill();
    ctx2.save();
    ctx2.beginPath();
    ctx2.arc(x, y, surface, 0, TAU);
    ctx2.clip();
    ctx2.fillStyle = "rgba(190, 60, 20, 0.18)";
    for (let i = 0; i < 5; i++) {
      const a = t * 0.07 * (i + 1) + i * 2.4;
      const rr = surface * (0.25 + 0.12 * i);
      ctx2.beginPath();
      ctx2.arc(x + Math.cos(a) * rr * 0.6, y + Math.sin(a) * rr * 0.6, rr * 0.42, 0, TAU);
      ctx2.fill();
    }
    ctx2.restore();
    ctx2.strokeStyle = "rgba(255, 220, 150, 0.8)";
    ctx2.lineWidth = 2;
    ctx2.beginPath();
    ctx2.arc(x, y, surface - 1, 0, TAU);
    ctx2.stroke();
  }
  var DUST_COLORS = ["#8ef6ff", "#ffe9a3", "#ffb3f2"];
  var DustField = class {
    constructor() {
      this.motes = [];
    }
    clear() {
      this.motes.length = 0;
    }
    drop(x, y, rng, count) {
      for (let i = 0; i < count; i++) {
        const a = rng.next() * TAU;
        const sp = 30 + rng.next() * 90;
        this.motes.push({
          x,
          y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 14,
          color: rng.pick(DUST_COLORS),
          ph: rng.range(0, TAU)
        });
      }
    }
    // Motes fall toward the star, swirl into the player's magnet field and are
    // collected on contact. Returns how many were collected this step; motes
    // that cross the star's surface are eaten (removed silently).
    update(dt, player, onCollect) {
      let collected = 0;
      const list = this.motes;
      for (let i = list.length - 1; i >= 0; i--) {
        const m = list[i];
        m.life -= dt;
        const r = applyGravity(m, dt, 0.55);
        m.vx *= Math.max(0, 1 - 0.25 * dt);
        m.vy *= Math.max(0, 1 - 0.25 * dt);
        if (player && player.alive) {
          const dx = player.x - m.x;
          const dy = player.y - m.y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < player.stats.magnet) {
            const pull = 900 * (1 - d / player.stats.magnet) + 120;
            m.vx += dx / (d || 1) * pull * dt;
            m.vy += dy / (d || 1) * pull * dt;
          }
          if (d < 26) {
            collected++;
            onCollect(m);
            list.splice(i, 1);
            continue;
          }
        }
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        if (m.life <= 0 || r < STAR.surface - 4) list.splice(i, 1);
      }
      return collected;
    }
    draw(ctx2, t) {
      for (const m of this.motes) {
        const tw = 0.7 + 0.3 * Math.sin(t * 5 + m.ph);
        const urgent = m.life < 3 ? Math.sin(t * 14 + m.ph) > 0 ? 1 : 0.25 : 1;
        ctx2.globalAlpha = tw * urgent;
        ctx2.fillStyle = m.color;
        ctx2.shadowColor = m.color;
        ctx2.shadowBlur = 10;
        ctx2.beginPath();
        ctx2.arc(m.x, m.y, 3, 0, TAU);
        ctx2.fill();
      }
      ctx2.globalAlpha = 1;
      ctx2.shadowBlur = 0;
    }
  };

  // orbitfall/game/js/ship.js
  var SHIP_RADIUS = 14;
  var ARENA_RADIUS = 700;
  function defaultStats() {
    return {
      fireInterval: 0.16,
      // seconds between shots
      damage: 1,
      bulletSpeed: 640,
      projectiles: 1,
      // pellets per volley (Split Shot)
      thrust: 560,
      magnet: 95,
      // stardust attraction radius
      novaLevel: 0,
      // Nova Pulse stacks
      novaDamage: 3,
      novaCooldown: 11,
      armor: 0,
      // fraction of incoming damage shrugged off
      comboWindow: 2.6
      // seconds to chain kills
    };
  }
  var Ship = class {
    constructor() {
      this.radius = SHIP_RADIUS;
      this.stats = defaultStats();
      this.reset(340);
    }
    // Place the ship on a stable-ish orbit at the given radius from the star.
    reset(orbitRadius = 340) {
      this.stats = defaultStats();
      this.maxHp = 100;
      this.hp = this.maxHp;
      const a = -Math.PI / 2;
      this.x = STAR.x + Math.cos(a) * orbitRadius;
      this.y = STAR.y + Math.sin(a) * orbitRadius;
      const accel = 235e5 / (orbitRadius * orbitRadius + 150 * 150);
      const speed = Math.sqrt(accel * orbitRadius) * 0.92;
      this.vx = -Math.sin(a) * speed;
      this.vy = Math.cos(a) * speed;
      this.angle = a + Math.PI / 2;
      this.fireTimer = 0;
      this.novaTimer = this.stats.novaCooldown;
      this.invuln = 0;
      this.alive = true;
      this.thrusting = false;
    }
    // input: { thrustX, thrustY } in -1..1, aimX/aimY in world coords.
    update(dt, input) {
      if (!this.alive) return;
      this.invuln = Math.max(0, this.invuln - dt);
      this.fireTimer = Math.max(0, this.fireTimer - dt);
      this.angle = Math.atan2(input.aimY - this.y, input.aimX - this.x);
      const tx = input.thrustX;
      const ty = input.thrustY;
      this.thrusting = tx !== 0 || ty !== 0;
      if (this.thrusting) {
        const len = Math.sqrt(tx * tx + ty * ty) || 1;
        this.vx += tx / len * this.stats.thrust * dt;
        this.vy += ty / len * this.stats.thrust * dt;
      }
      applyGravity(this, dt, 1);
      orbitalDamp(this, dt, this.thrusting ? 0.35 : 0.8, 0.05);
      const r = distToStar(this.x, this.y);
      if (r > ARENA_RADIUS) {
        const ux = (this.x - STAR.x) / r;
        const uy = (this.y - STAR.y) / r;
        this.vx -= ux * (r - ARENA_RADIUS) * 2.4 * dt * 60 * 0.016;
        this.vy -= uy * (r - ARENA_RADIUS) * 2.4 * dt * 60 * 0.016;
      }
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      const maxSpeed = 520;
      if (speed > maxSpeed) {
        this.vx = this.vx / speed * maxSpeed;
        this.vy = this.vy / speed * maxSpeed;
      }
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.x = clamp(this.x, 16, 1264);
      this.y = clamp(this.y, 16, 784);
    }
    canFire() {
      return this.alive && this.fireTimer <= 0;
    }
    markFired() {
      this.fireTimer = this.stats.fireInterval;
    }
    // Returns the damage actually taken after armor.
    hurt(amount) {
      if (!this.alive || this.invuln > 0) return 0;
      const dealt = Math.max(1, Math.round(amount * (1 - this.stats.armor)));
      this.hp -= dealt;
      this.invuln = 0.7;
      if (this.hp <= 0) {
        this.hp = 0;
        this.alive = false;
      }
      return dealt;
    }
    heal(amount) {
      this.hp = Math.min(this.maxHp, this.hp + amount);
    }
    draw(ctx2, t) {
      if (!this.alive) return;
      const blink = this.invuln > 0 && Math.sin(t * 30) > 0;
      ctx2.save();
      ctx2.translate(this.x, this.y);
      ctx2.rotate(this.angle);
      ctx2.globalAlpha = blink ? 0.35 : 1;
      if (this.thrusting) {
        const fl = 12 + Math.sin(t * 42) * 4;
        const grad = ctx2.createLinearGradient(-12, 0, -12 - fl, 0);
        grad.addColorStop(0, "rgba(140, 240, 255, 0.9)");
        grad.addColorStop(1, "rgba(60, 120, 255, 0)");
        ctx2.fillStyle = grad;
        ctx2.beginPath();
        ctx2.moveTo(-11, -4.5);
        ctx2.lineTo(-12 - fl, 0);
        ctx2.lineTo(-11, 4.5);
        ctx2.closePath();
        ctx2.fill();
      }
      ctx2.beginPath();
      ctx2.moveTo(17, 0);
      ctx2.lineTo(-7, -7);
      ctx2.lineTo(-13, -12);
      ctx2.lineTo(-9, 0);
      ctx2.lineTo(-13, 12);
      ctx2.lineTo(-7, 7);
      ctx2.closePath();
      ctx2.fillStyle = "#0d2438";
      ctx2.fill();
      ctx2.strokeStyle = "#37f4ff";
      ctx2.lineWidth = 2;
      ctx2.shadowColor = "#37f4ff";
      ctx2.shadowBlur = 10;
      ctx2.stroke();
      ctx2.shadowBlur = 0;
      ctx2.fillStyle = "#bffbff";
      ctx2.beginPath();
      ctx2.arc(5, 0, 3.2, 0, Math.PI * 2);
      ctx2.fill();
      ctx2.restore();
    }
  };

  // orbitfall/game/js/enemies.js
  var ENEMY_TYPES = {
    drifter: { hp: 3, radius: 15, speed: 130, score: 100, dust: 1, contact: 10, color: "#ff4d6d" },
    mini: { hp: 1, radius: 9, speed: 185, score: 40, dust: 0, contact: 6, color: "#ff8fa8" },
    splitter: { hp: 5, radius: 19, speed: 105, score: 180, dust: 2, contact: 12, color: "#c44dff" },
    weaver: { hp: 4, radius: 14, speed: 150, score: 150, dust: 1, contact: 10, color: "#ffb02e" },
    sniper: { hp: 4, radius: 15, speed: 120, score: 220, dust: 2, contact: 10, color: "#3dff8e" },
    sentinel: { hp: 90, radius: 46, speed: 62, score: 2e3, dust: 12, contact: 25, color: "#ff3df0" }
  };
  var nextId = 1;
  var Enemy = class {
    // Spawned on the rim at angle `a`, given tangential orbital velocity so it
    // sweeps inward like everything else in this arena.
    constructor(type, a, rng, hpScale = 1) {
      const cfg = ENEMY_TYPES[type];
      this.id = nextId++;
      this.type = type;
      this.cfg = cfg;
      this.maxHp = Math.round(cfg.hp * hpScale);
      this.hp = this.maxHp;
      this.radius = cfg.radius;
      const rim = 665;
      this.x = STAR.x + Math.cos(a) * rim;
      this.y = STAR.y + Math.sin(a) * rim;
      const dir = rng.sign();
      const orbitSpeed = 155 + rng.next() * 55;
      this.vx = -Math.sin(a) * orbitSpeed * dir;
      this.vy = Math.cos(a) * orbitSpeed * dir;
      this.seed = rng.next() * 1e3;
      this.age = 0;
      this.fireTimer = rng.range(1.4, 2.8);
      this.ringTimer = 3.4;
      this.spawnTimer = 5;
      this.flash = 0;
      this.dead = false;
    }
    // env: { player, time, shoot(x, y, angle), spawnMini(x, y, rng), rng }
    update(dt, env) {
      const { player } = env;
      this.age += dt;
      this.flash = Math.max(0, this.flash - dt);
      applyGravity(this, dt, this.type === "sentinel" ? 0.55 : 0.7);
      orbitalDamp(this, dt, this.type === "sentinel" ? 0.25 : 0.8, 0.04);
      const dx = player.x - this.x;
      const dy = player.y - this.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const ux = dx / d;
      const uy = dy / d;
      const s = this.cfg.speed;
      const steer = (ax, ay, strength) => {
        this.vx += ax * strength * dt;
        this.vy += ay * strength * dt;
      };
      switch (this.type) {
        case "drifter":
        case "mini":
          steer(ux, uy, s * 2.4);
          break;
        case "splitter":
          steer(ux, uy, s * 1.9);
          break;
        case "weaver": {
          const wob = Math.sin(this.age * 3.4 + this.seed);
          steer(ux + -uy * wob * 0.9, uy + ux * wob * 0.9, s * 2.2);
          break;
        }
        case "sniper": {
          this.aimX = player.x;
          this.aimY = player.y;
          const want = d > 430 ? 1 : d < 320 ? -1 : 0;
          const strafe = Math.sin(this.age * 0.9 + this.seed) > 0 ? 1 : -1;
          steer(ux * want + -uy * strafe * 0.55, uy * want + ux * strafe * 0.55, s * 2.1);
          this.fireTimer -= dt;
          if (this.fireTimer <= 0 && player.alive && d < 560) {
            this.fireTimer = 2.6;
            env.shoot(this.x, this.y, Math.atan2(dy, dx));
          }
          break;
        }
        case "sentinel": {
          steer(ux, uy, s * 1.1);
          this.ringTimer -= dt;
          if (this.ringTimer <= 0 && player.alive) {
            this.ringTimer = 3.4;
            const base = env.time * 0.7 + this.seed;
            for (let i = 0; i < 14; i++) env.shoot(this.x, this.y, base + i / 14 * TAU);
          }
          this.spawnTimer -= dt;
          if (this.spawnTimer <= 0) {
            this.spawnTimer = 5.5;
            env.spawnMini(this.x, this.y);
          }
          break;
        }
      }
      const cap = this.type === "mini" ? 300 : this.type === "sentinel" ? 120 : 250;
      const sp = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (sp > cap) {
        this.vx = this.vx / sp * cap;
        this.vy = this.vy / sp * cap;
      }
      this.x += this.vx * dt;
      this.y += this.vy * dt;
    }
    draw(ctx2, t) {
      const c = this.cfg.color;
      ctx2.save();
      ctx2.translate(this.x, this.y);
      ctx2.shadowColor = c;
      ctx2.shadowBlur = 12;
      ctx2.fillStyle = this.flash > 0 ? "#ffffff" : "#160a1e";
      ctx2.strokeStyle = c;
      ctx2.lineWidth = 2;
      const rot = this.age * 0.8 + this.seed;
      switch (this.type) {
        case "drifter": {
          ctx2.rotate(rot);
          ctx2.beginPath();
          for (let i = 0; i < 3; i++) {
            const a = i / 3 * TAU;
            ctx2[i ? "lineTo" : "moveTo"](Math.cos(a) * this.radius, Math.sin(a) * this.radius);
          }
          ctx2.closePath();
          ctx2.fill();

          color,
          1.4,
          0.35

        ctx2.fillRect(0, 0, VIEW_W, VIEW_H);
      }
      switch (this.state) {
        case "title":
          drawTitleScreen(ctx2, this, this.time);
          break;
        case "playing":
          drawHUD(ctx2, this);
          break;
        case "draft":
          drawHUD(ctx2, this);
          drawDraftScreen(ctx2, this, this.time);
          break;
        case "paused":
          drawHUD(ctx2, this);
          drawPauseScreen(ctx2);
          break;
        case "gameover":
          drawGameOverScreen(ctx2, this, this.time);
          break;
      }
    }
  };

  // orbitfall/game/js/audio.js
  var Synth = class {
    constructor(enabled) {
      this.enabled = enabled;
      this.ctx = null;
      this.master = null;
      this.muted = false;
      this.noiseBuffer = null;
      this.lastLaser = 0;
    }
    // Call from a user gesture (click / keydown) so the browser lets us play.
    unlock() {
      if (!this.enabled || this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate * 0.5;
      this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    toggleMute() {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.35;
      return this.muted;
    }
    tone(freqA, freqB, dur, type, vol, when = 0) {
      if (!this.ctx || this.muted) return;
      const t0 = this.ctx.currentTime + when;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqA, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqB), t0 + dur);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(1e-3, t0 + dur);
      osc.connect(gain).connect(this.master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }
    noise(dur, vol, freq, q = 1) {
      if (!this.ctx || this.muted) return;
      const t0 = this.ctx.currentTime;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      src.loop = true;
      const filter = this.ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(freq, t0);
      filter.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.2), t0 + dur);
      filter.Q.value = q;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(1e-3, t0 + dur);
      src.connect(filter).connect(gain).connect(this.master);
      src.start(t0);
      src.stop(t0 + dur + 0.02);
    }
    laser() {
      if (!this.ctx || this.muted) return;
      const now = performance.now();
      if (now - this.lastLaser < 45) return;
      this.lastLaser = now;
      this.tone(920, 240, 0.09, "square", 0.1);
    }
    explosion(big = false) {
      this.noise(big ? 0.7 : 0.35, big ? 0.5 : 0.28, big ? 900 : 1400);
      this.tone(big ? 160 : 220, 40, big ? 0.6 : 0.3, "triangle", 0.25);
    }
    pickup() {
      this.tone(660, 990, 0.08, "sine", 0.12);
      this.tone(990, 1320, 0.1, "sine", 0.08, 0.05);
    }
    upgrade() {
      this.tone(523, 523, 0.1, "triangle", 0.16);
      this.tone(659, 659, 0.1, "triangle", 0.16, 0.09);
      this.tone(784, 784, 0.16, "triangle", 0.18, 0.18);
    }
    playerHit() {
      this.noise(0.25, 0.4, 2e3);
      this.tone(300, 70, 0.3, "sawtooth", 0.22);
    }
    bossWarn() {
      this.tone(196, 196, 0.22, "sawtooth", 0.2);
      this.tone(196, 196, 0.22, "sawtooth", 0.2, 0.3);
      this.tone(262, 262, 0.34, "sawtooth", 0.2, 0.6);
    }
    draftOpen() {
      this.tone(440, 880, 0.18, "sine", 0.12);
    }
  };

  // orbitfall/game/js/main.js
  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  canvas.width = VIEW_W;
  canvas.height = VIEW_H;
  var params = new URLSearchParams(window.location.search);
  var shot = params.get("shot");
  var seed = Number(params.get("seed")) || 7;
  var synth = new Synth(!shot);
  var game = new Game({ shot, seed, synth });
  window.__orbitfall = game;
  function fitCanvas() {
    const scale = Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H);
    canvas.style.width = `${Math.floor(VIEW_W * scale)}px`;
    canvas.style.height = `${Math.floor(VIEW_H * scale)}px`;
  }
  window.addEventListener("resize", fitCanvas);
  fitCanvas();
  function toGameCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) / rect.width * VIEW_W,
      y: (clientY - rect.top) / rect.height * VIEW_H
    };
  }
  window.addEventListener("keydown", (e) => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
    synth.unlock();
    if (!e.repeat) game.pressKey(e.code);
    else game.keys.add(e.code);
  });
  window.addEventListener("keyup", (e) => game.releaseKey(e.code));
  window.addEventListener("blur", () => {
    game.keys.clear();
    game.mouse.down = false;
    if (game.state === "playing" && !game.shot) game.state = "paused";
  });
  canvas.addEventListener("mousemove", (e) => {
    const p = toGameCoords(e.clientX, e.clientY);
    game.mouse.x = p.x;
    game.mouse.y = p.y;
  });
  canvas.addEventListener("mousedown", (e) => {
    const p = toGameCoords(e.clientX, e.clientY);
    game.mouse.x = p.x;
    game.mouse.y = p.y;
    game.mouse.down = true;
    game.click(p.x, p.y);
  });
  window.addEventListener("mouseup", () => {
    game.mouse.down = false;
  });
  var last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1e3;
    last = now;
    if (dt > 0.05) dt = 0.05;
    game.update(dt);
    game.render(ctx);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
